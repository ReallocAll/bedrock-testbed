name: Isolated BDS 1.26.65 official allocator injection

on:
  push:
    branches: [test/onhit-12665-official-allocator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ReallocAll/endstone
          ref: 1fad28dccf2b8ce9c4d8752a5c55d3c38950a589
          path: endstone-src
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./endstone-src/.github/actions/setup-clang
      - uses: astral-sh/setup-uv@v5
      - name: Build and install exact patched Endstone
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C endstone-src rev-parse HEAD)" = 1fad28dccf2b8ce9c4d8752a5c55d3c38950a589
          sudo apt-get install -y --no-install-recommends libelf-dev gdb binutils
          python -m pip install conan ninja
          python -m venv .venv-server
          .venv-server/bin/python -m pip install -v ./endstone-src
          .venv-server/bin/python -m pip install 'git+https://github.com/ReallocAll/endstone-bot.git@4bd0691f1ef0f551e5ba258d4747b35a3b748177'
          .venv-server/bin/python -m pip check
          .venv-server/bin/python -c 'import importlib.metadata as m; print("PATCHED_ENDSTONE_VERSION",m.version("endstone"))'
      - name: Install official precompiled mimalloc 3.7.0
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/microsoft/mimalloc/releases/download/v3.7.0/mimalloc-v3.7.0-linux-x64.tar.gz
          mkdir -p external-mimalloc
          curl --fail --location --retry 3 --silent --show-error "$url" -o external-mimalloc/official.tar.gz
          echo "bb6198f1bcefcdaa9384b738b568d46be6550d8cf60d84281252a6c7f3839cd4  external-mimalloc/official.tar.gz" | sha256sum --check
          tar -xzf external-mimalloc/official.tar.gz -C external-mimalloc
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd() / "external-mimalloc"
          candidates = [p for p in root.rglob("libmimalloc.so*") if p.is_file()]
          candidates = [p for p in candidates if "debug" not in str(p).lower() and "secure" not in str(p).lower()]
          if not candidates:
              raise RuntimeError("Official release archive has no standard libmimalloc.so")
          candidates.sort(key=lambda p: (p.name != "libmimalloc.so", len(str(p))))
          selected = candidates[0].resolve(strict=True)
          print("OFFICIAL_MIMALLOC_PRELOAD", selected, flush=True)
          print("OFFICIAL_MIMALLOC_CANDIDATES", [str(p.relative_to(root)) for p in candidates[:12]], flush=True)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ONHIT_EXTERNAL_ALLOCATOR={selected}\n")
          PY
      - name: Trace OnHit with upstream mimalloc (not Endstone bundled)
        id: upstream_mimalloc
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile server.py onhit_12665_probe.py
          ENDSTONE_TEST_VERSION="$(.venv-server/bin/python -c 'import importlib.metadata as m; print(m.version("endstone"))')" \
            python - <<'PY'
          import os
          import sys
          from pathlib import Path
          allocator = Path(os.environ["ONHIT_EXTERNAL_ALLOCATOR"]).resolve(strict=True)
          # Match the production launcher: set LD_PRELOAD after Python starts,
          # so it applies to the spawned BDS and Endstone appends its runtime.
          os.environ["LD_PRELOAD"] = str(allocator)
          os.environ.pop("MALLOC_CONF", None)
          sys.argv = ["onhit_12665_probe.py", "--server-python", ".venv-server/bin/python"]
          from onhit_12665_probe import main
          main()
          PY
      - name: Diagnose upstream-mimalloc startup failure
        if: failure() && steps.upstream_mimalloc.outcome == 'failure'
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sysconfig
          pyexe = (Path.cwd() / ".venv-server/bin/python").absolute()
          libdir = Path(subprocess.check_output(
              [str(pyexe), "-c", "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))"],
              text=True
          ).strip())
          runtime = Path(subprocess.check_output(
              [str(pyexe), "-c", "from pathlib import Path; import endstone; print(Path(endstone.__file__).parent / 'libendstone_runtime.so')"],
              text=True
          ).strip())
          pythonpath = subprocess.check_output(
              [str(pyexe), "-c", "import os, sys; print(os.pathsep.join(sys.path))"], text=True
          ).strip()
          game = (Path.cwd() / "work-onhit65/server").resolve()
          if not (game / "bedrock_server").is_file() or not runtime.is_file():
              print("No BDS/runtime to diagnose")
              raise SystemExit(0)
          options = [
              "set pagination off",
              "set confirm off",
              "set print thread-events off",
              "set disable-randomization off",
              "handle SIGPIPE nostop noprint pass",
              f"set environment LD_PRELOAD {os.environ['ONHIT_EXTERNAL_ALLOCATOR']}:{runtime}",
              f"set environment LD_LIBRARY_PATH {libdir}",
              f"set environment ENDSTONE_PYTHON_EXECUTABLE {pyexe}",
              f"set environment PYTHONPATH {pythonpath}",
              "set environment PYTHONIOENCODING UTF-8",
              "run",
              "bt 28",
              "info registers rip rdi rsi rdx rcx",
              "x/8i $pc",
          ]
          args = ["timeout", "110s", "gdb", "-q", "-nx", "--batch"]
          for item in options:
              args += ["-ex", item]
          args += ["--args", str(game / "bedrock_server")]
          with (Path.cwd() / "work-onhit65/startup-gdb.log").open("w") as logfile:
              proc = subprocess.run(args, cwd=game, stdout=logfile,
                                    stderr=subprocess.STDOUT, timeout=120, check=False)
          print("Diagnostic GDB returncode:", proc.returncode)
          print((Path.cwd() / "work-onhit65/startup-gdb.log").read_text(errors="replace")[-12000:])
          PY
      - name: Try system jemalloc if official mimalloc fails
        if: failure() && steps.upstream_mimalloc.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if test -d work-onhit65; then mv work-onhit65 work-onhit65-upstream-mimalloc; fi
          sudo apt-get install -y --no-install-recommends libjemalloc2
          allocator="$(ldconfig -p | awk '/libjemalloc.so.2 / {print $NF; exit}')"
          test -f "$allocator"
          export ONHIT_EXTERNAL_ALLOCATOR="$allocator"
          echo "JEMALLOC_FALLBACK_PRELOAD=$allocator"
          ENDSTONE_TEST_VERSION="$(.venv-server/bin/python -c 'import importlib.metadata as m; print(m.version("endstone"))')" \
            python - <<'PY'
          import os
          import sys
          os.environ["LD_PRELOAD"] = os.environ["ONHIT_EXTERNAL_ALLOCATOR"]
          os.environ.pop("MALLOC_CONF", None)
          sys.argv = ["onhit_12665_probe.py", "--server-python", ".venv-server/bin/python"]
          from onhit_12665_probe import main
          main()
          PY
      - name: Print decisive events
        if: always()
        run: |
          if test -f work-onhit65/result.json; then cat work-onhit65/result.json; fi
          if test -f work-onhit65/ownership-gdb.log; then
            grep -E 'REINIT_NONEMPTY|OLD_TRIPLET|FINAL_TRIPLET|WATCHED_CHILD_DEALLOC|DELETING_DTOR|TRACKED_RECORD_CLEANUP|COPY_NONEMPTY|Error|warning' work-onhit65/ownership-gdb.log | tail -120 || true
          fi
          if test -f work-onhit65/bds.log; then tail -n 45 work-onhit65/bds.log; fi
      - name: Preserve patched native trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onhit-12665-patched-native-ownership
          path: |
            work-onhit65/result.json
            work-onhit65/startup-gdb.log
            work-onhit65/allocator-swap-bds.log
            work-onhit65/ownership-gdb.log
            work-onhit65/bds.log
            work-onhit65/server/version.txt
            work-onhit65-upstream-mimalloc/result.json
            work-onhit65-upstream-mimalloc/startup-gdb.log
            work-onhit65-upstream-mimalloc/ownership-gdb.log
            work-onhit65-upstream-mimalloc/bds.log
          if-no-files-found: warn
          retention-days: 14
