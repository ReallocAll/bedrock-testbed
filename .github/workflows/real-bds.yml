name: Real BDS EndPilot Smoke

on:
  push:
    branches: [feat/endpilot-real-bds, 'test/**', 'fix/**', main]
  workflow_dispatch:
    inputs:
      endpilot_commit:
        description: 'Exact EndPilot commit SHA (40 lowercase hex characters)'
        required: false
        type: string
        default: '1d530f0efbb3b0ac03f0945f2f5d89efa81eee3a'

permissions:
  contents: read

concurrency:
  group: real-bds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpilot:
    if: github.actor == 'ReallocAll' && github.ref_name != 'test/chunk-operability-a1b-20261101' && github.ref_name != 'test/chunk-operability-a1b-seed0-20261102'
    name: EndPilot (${{ matrix.suite }}, ${{ matrix.transport }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        transport: [raknet, nethernet]
        suite: ${{ fromJSON((github.ref_name == 'main' || github.ref_name == 'test/navigation-frontier-20261101') && '["smoke","navigation"]' || '["branch"]') }}
    timeout-minutes: 30
    env:
      ENDPILOT_COMMIT: ${{ inputs.endpilot_commit || '1d530f0efbb3b0ac03f0945f2f5d89efa81eee3a' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated Endstone server
        run: |
          python -m venv .venv-server
          .venv-server/bin/python -m pip install 'endstone==0.11.14'
      - name: Build test-only Endstone chunk observer
        if: github.ref_name == 'test/chunk-operability-20261101'
        run: |
          set -euo pipefail
          mkdir -p .chunkop-wheel
          .venv-server/bin/python -m pip wheel --no-deps --wheel-dir .chunkop-wheel diagnostics/endstone_chunk_observer
      - name: Get pinned protocol compiler wheel
        uses: actions/download-artifact@v4
        with:
          name: python-pure
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/pure
      - name: Get pinned Linux native protocol wheel
        uses: actions/download-artifact@v4
        with:
          name: python-native-Linux
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/native
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated EndPilot client
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ENDPILOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::endpilot_commit must be a full lowercase 40-character SHA'
            exit 1
          fi
          python -m venv .venv-client
          .venv-client/bin/python -m pip install dependencies/pure/*.whl dependencies/native/*.whl \
            "endpilot[raknet] @ git+https://github.com/ReallocAll/endpilot.git@${ENDPILOT_COMMIT}"
          .venv-client/bin/python -m pip check
          .venv-client/bin/python -m pip show endpilot bedrock-protocol-native
      - name: Exercise public Typed Packet API against fresh real BDS
        shell: bash
        run: |
          if [[ "${{ matrix.suite }}" == "navigation" ]]; then
            .venv-client/bin/python navigation_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ matrix.suite }}" == "smoke" ]]; then
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == "test/chunk-operability-20261101" ]]; then
            mapfile -t observer_wheels < <(find .chunkop-wheel -maxdepth 1 -type f -name 'endstone_chunk_observer-*.whl')
            if [[ "${#observer_wheels[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one test observer wheel, found ${#observer_wheels[@]}"
              exit 1
            fi
            .venv-client/bin/python chunk_operability_probe.py \
              --server-python .venv-server/bin/python \
              --endpilot-commit "$ENDPILOT_COMMIT" \
              --transport "${{ matrix.transport }}" \
              --plugin-wheel "${observer_wheels[0]}"
          elif [[ "${{ github.ref_name }}" == test/world-data-* ]]; then
            .venv-client/bin/python world_probe.py --server-python .venv-server/bin/python --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/navigation-* ]]; then
            .venv-client/bin/python navigation_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/controller-* ]]; then
            .venv-client/bin/python movement_controller_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/motion-* ]]; then
            .venv-client/bin/python motion_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/stability-* ]]; then
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}" --stability
          else
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          fi
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-bds-endpilot-${{ matrix.transport }}${{ github.ref_name == 'test/chunk-operability-20261101' && '-chunk-operability' || matrix.suite == 'navigation' && '-navigation' || '' }}
          path: |
            work/result.json
            work/chunk_operability.json
            work/world_probe.json
            work/motion_trajectory.json
            work/controller_trajectory.json
            work/navigation_trajectory.json
            work/bds.log
            work/server/version.txt
            work/server/server.properties
          if-no-files-found: warn
          retention-days: 14

  a1b:
    if: >-
      github.actor == 'ReallocAll' &&
      github.event_name == 'push' &&
      github.ref_name == 'test/chunk-operability-a1b-seed0-20261102' &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after == github.sha &&
      github.event.head_commit.message == 'test(a1b): seed-zero four-condition experiment [A1b-20261102]'
    name: A1b fixed-world four-condition BDS
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare exact Endstone and A1 observer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-server
          .venv-server/bin/python -m pip install 'endstone==0.11.14'
          mkdir -p .chunkop-wheel
          .venv-server/bin/python -m pip wheel --no-deps --wheel-dir .chunkop-wheel diagnostics/endstone_chunk_observer
      - name: Get pinned pure protocol wheel
        uses: actions/download-artifact@v4
        with:
          name: python-pure
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/pure
      - name: Get pinned Linux native protocol wheel
        uses: actions/download-artifact@v4
        with:
          name: python-native-Linux
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/native
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run unique A1b four-condition lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.head_commit.id }}" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m venv .venv-client
          .venv-client/bin/python -m pip install dependencies/pure/*.whl dependencies/native/*.whl \
            'endpilot[raknet] @ git+https://github.com/ReallocAll/endpilot.git@1d530f0efbb3b0ac03f0945f2f5d89efa81eee3a'
          .venv-client/bin/python -m pip check
          mapfile -t wheels < <(find .chunkop-wheel -maxdepth 1 -type f -name 'endstone_chunk_observer-*.whl')
          test "${#wheels[@]}" -eq 1
          .venv-client/bin/python chunk_operability_a1b_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit 1d530f0efbb3b0ac03f0945f2f5d89efa81eee3a \
            --plugin-wheel "${wheels[0]}"
      - name: Upload A1b evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-operability-a1b-seed0-20261102
          path: |
            work/a1b/**
            work/result.json
          if-no-files-found: error
          retention-days: 14
