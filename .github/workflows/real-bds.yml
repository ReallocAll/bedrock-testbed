name: Real BDS EndPilot Smoke

on:
  push:
    branches: [feat/endpilot-real-bds, 'test/**', 'fix/**', main]
  workflow_dispatch:
    inputs:
      endpilot_commit:
        description: 'Exact EndPilot commit SHA (40 lowercase hex characters)'
        required: false
        type: string
        default: '96045ce85d9ba373db64daab09cc7176e1e29a15'
      capacity_bots:
        description: 'Capacity run bot count, 0 disables capacity mode'
        required: false
        default: '0'
        type: string
      capacity_transport:
        description: 'Capacity run transport'
        required: false
        default: 'raknet'
        type: choice
        options: [raknet, nethernet]

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.capacity_bots != '' && inputs.capacity_bots != '0') && 'endpilot-capacity-exclusive' || format('real-bds-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.capacity_bots == '' || inputs.capacity_bots == '0' }}

jobs:
  endpilot:
    if: github.actor == 'ReallocAll'
    name: EndPilot (${{ matrix.suite }}, ${{ matrix.transport }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        transport: ${{ fromJSON((inputs.capacity_bots != '' && inputs.capacity_bots != '0') && format('["{0}"]', inputs.capacity_transport) || '["raknet","nethernet"]') }}
        suite: ${{ fromJSON((inputs.capacity_bots != '' && inputs.capacity_bots != '0') && '["capacity"]' || ((github.ref_name == 'main' || github.ref_name == 'test/navigation-frontier-20261101') && '["smoke","navigation"]' || '["branch"]')) }}
    timeout-minutes: ${{ matrix.suite == 'capacity' && 25 || 30 }}
    env:
      ENDPILOT_COMMIT: ${{ inputs.endpilot_commit || '96045ce85d9ba373db64daab09cc7176e1e29a15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated Endstone server
        run: |
          python -m venv .venv-server
          .venv-server/bin/python -m pip install 'endstone==0.11.14'
      - name: Get pinned protocol compiler wheel
        uses: actions/download-artifact@v4
        with:
          name: python-pure
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/pure
      - name: Get pinned Linux native protocol wheel
        uses: actions/download-artifact@v4
        with:
          name: python-native-Linux
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/native
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated EndPilot client
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ENDPILOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::endpilot_commit must be a full lowercase 40-character SHA'
            exit 1
          fi
          python -m venv .venv-client
          .venv-client/bin/python -m pip install dependencies/pure/*.whl dependencies/native/*.whl \
            "endpilot[raknet] @ git+https://github.com/ReallocAll/endpilot.git@${ENDPILOT_COMMIT}"
          .venv-client/bin/python -m pip check
          .venv-client/bin/python -m pip show endpilot bedrock-protocol-native
      # Diagnostic ablation only, installed venv; fixed SDK commit and protocol decode unchanged.
      - name: Ablate remote Actor motion observation (50 Bot RakNet only)
        if: ${{ inputs.capacity_bots == '50' && inputs.capacity_transport == 'raknet' }}
        shell: bash
        run: |
          .venv-client/bin/python - <<'PY'
          from pathlib import Path
          import endpilot.session as module
          path = Path(module.__file__)
          source = path.read_text()
          original_player = "                if actor is not None and actor.type == \"minecraft:player\":\n                    self.move_actor(actor, vec(packet.pos), packet.rot.x, packet.rot.y, packet.y_head_rot)\n"
          ablated_player = "                if actor is not None and actor.type == \"minecraft:player\":\n                    Session.actor_ablation_skipped += 1\n"
          original_motion = "        elif id in (18, 111):\n            motion = self.actor_state.motion(packet, self.options.protocol)\n            if motion is not None:\n                self.move_actor(*motion)\n"
          ablated_motion = "        elif id in (18, 111):\n            if self.actor_state.get(packet.move_data.runtime_id) is not None:\n                Session.actor_ablation_skipped += 1\n"
          for original in (original_player, original_motion, "class Session:\n"):
              assert source.count(original) == 1, 'Pinned Session path changed'
          source = source.replace("class Session:\n", "class Session:\n    actor_ablation_skipped = 0\n", 1)
          source = source.replace(original_player, ablated_player, 1)
          source = source.replace(original_motion, ablated_motion, 1)
          compile(source, str(path), 'exec')
          path.write_text(source)
          print('Actor motion ablation patched: MovePlayer(remote), MoveActorAbsolute/Delta(known actor)')
          PY
      - name: Exercise public Typed Packet API against fresh real BDS
        shell: bash
        run: |
          if [[ "${{ matrix.suite }}" == "capacity" ]]; then
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}" --capacity-bots "${{ inputs.capacity_bots }}"
          elif [[ "${{ matrix.suite }}" == "navigation" ]]; then
            .venv-client/bin/python navigation_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ matrix.suite }}" == "smoke" ]]; then
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/world-data-* ]]; then
            .venv-client/bin/python world_probe.py --server-python .venv-server/bin/python --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/navigation-* ]]; then
            .venv-client/bin/python navigation_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/controller-* ]]; then
            .venv-client/bin/python movement_controller_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/motion-* ]]; then
            .venv-client/bin/python motion_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/stability-* ]]; then
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}" --stability
          else
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          fi
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-bds-endpilot-${{ matrix.transport }}${{ matrix.suite == 'navigation' && '-navigation' || '' }}
          path: |
            work/result.json
            work/world_probe.json
            work/motion_trajectory.json
            work/controller_trajectory.json
            work/navigation_trajectory.json
            work/capacity.json
            work/capacity_samples.csv
            work/capacity_thread_cpu.csv
            work/capacity_thread_cpu.log
            work/bds.log
            work/server/version.txt
            work/server/server.properties
          if-no-files-found: warn
          retention-days: 14
