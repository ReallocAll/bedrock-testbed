name: Real BDS EndPilot Smoke

on:
  push:
    branches: [feat/endpilot-real-bds, 'test/**', 'fix/**', main]
  workflow_dispatch:
    inputs:
      endpilot_commit:
        description: 'Exact EndPilot commit SHA (40 lowercase hex characters)'
        required: false
        type: string
        default: '847c0382ed444916172e6643af3795cdfd43a5d8'
      settings_probe:
        description: 'Run only the new EndPilot NetherNet settings probe'
        required: false
        type: boolean
        default: false
      join_probe:
        description: 'Verify offline-mode join/spawn/leave on new EndPilot'
        required: false
        type: boolean
        default: false
      position_probe:
        description: 'Verify server teleport position received by the new NetherNet player'
        required: false
        type: boolean
        default: false
      walk_probe:
        description: 'Verify server-accepted NetherNet walking input'
        required: false
        type: boolean
        default: false
      turn_probe:
        description: 'Verify target-facing forward walking through the public SDK'
        required: false
        type: boolean
        default: false
      follow_probe:
        description: 'Verify tracking a moving actor through public EndPilot SDK'
        required: false
        type: boolean
        default: false
      obstacle_probe:
        description: 'Verify observed-block obstacle route using the public SDK'
        required: false
        type: boolean
        default: false
      stop_probe:
        description: 'Verify explicit stop of a running player follow action on BDS'
        required: false
        type: boolean
        default: false
      switch_probe:
        description: 'Verify switching from a followed actor to another live actor'
        required: false
        type: boolean
        default: false
      block_probe:
        description: 'Verify a real BDS block update reaches the EndPilot client'
        required: false
        type: boolean
        default: false
      subchunk_probe:
        description: 'Verify requested sub-chunk distinguishes air, solid and unknown'
        required: false
        type: boolean
        default: false
      place_probe:
        description: 'Verify player-initiated block placement through Endstone cancel/allow'
        required: false
        type: boolean
        default: false
      mcp_probe:
        description: 'Verify player block placement by invoking MCP stdio tools'
        required: false
        type: boolean
        default: false
      kick_probe:
        description: 'Verify a server kick is observed after cancelled/allowed placement'
        required: false
        type: boolean
        default: false
      refusal_probe:
        description: 'Verify full BDS rejects a second player with LoginRefused'
        required: false
        type: boolean
        default: false
      timeout_probe:
        description: 'Verify a live player block wait times out and subsequent placement succeeds'
        required: false
        type: boolean
        default: false
      chat_probe:
        description: 'Verify two EndPilot clients exchange chat through BDS'
        required: false
        type: boolean
        default: false
      command_probe:
        description: 'Verify a player command output and BDS block effect'
        required: false
        type: boolean
        default: false
      entity_probe:
        description: 'Observe server-summoned cow spawn, movement and removal via SDK packets'
        required: false
        type: boolean
        default: false
      health_probe:
        description: 'Use true for health, mcp-walk, mcp-handoff, respawn, hunger, container, container-split, trade, trade-interrupt, trade-two-input, trade-server-interrupt, trade-reconnect, trade-original, form, craft, craft-store, craft-grid, craft-workbench, craft-tool, furnace, furnace-store or drop'
        required: false
        type: string
        default: ''
      hotbar_probe:
        description: 'Verify server-accepted selected hotbar item on both transports'
        required: false
        type: boolean
        default: false
      mining_probe:
        description: 'Verify survival block mining through public SDK and real BDS'
        required: false
        type: boolean
        default: false
      pickup_probe:
        description: 'Verify mined-item pickup, placement and consumption on both transports'
        required: false
        type: boolean
        default: false
      identity_probe:
        description: 'Verify optional NetherNet server identity pinning'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: real-bds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpilot:
    if: github.actor == 'ReallocAll' && !inputs.settings_probe && !inputs.join_probe && !inputs.position_probe && !inputs.walk_probe && (inputs.health_probe != 'mcp-walk' && inputs.health_probe != 'mcp-handoff') && !inputs.turn_probe && !inputs.follow_probe && !inputs.stop_probe && !inputs.switch_probe && !inputs.obstacle_probe && !inputs.identity_probe && !inputs.block_probe && !inputs.subchunk_probe && !inputs.place_probe && !inputs.mcp_probe && !inputs.kick_probe && !inputs.refusal_probe && !inputs.timeout_probe && !inputs.chat_probe && !inputs.command_probe && !inputs.entity_probe && inputs.health_probe != 'true' && inputs.health_probe != 'respawn' && inputs.health_probe != 'hunger' && !inputs.hotbar_probe && !inputs.mining_probe && !inputs.pickup_probe && (inputs.health_probe != 'container' && inputs.health_probe != 'container-take' && inputs.health_probe != 'container-split' && inputs.health_probe != 'container-put' && inputs.health_probe != 'container-equip' && (inputs.health_probe != 'trade' && inputs.health_probe != 'trade-interrupt' && inputs.health_probe != 'trade-two-input' && (inputs.health_probe != 'trade-server-interrupt' && (inputs.health_probe != 'trade-reconnect' && inputs.health_probe != 'trade-original'))) && inputs.health_probe != 'form' && inputs.health_probe != 'craft' && inputs.health_probe != 'craft-store' && inputs.health_probe != 'craft-grid' && (inputs.health_probe != 'craft-workbench' && inputs.health_probe != 'craft-tool') && (inputs.health_probe != 'furnace' && inputs.health_probe != 'furnace-store') && inputs.health_probe != 'drop' && inputs.health_probe != 'container-server-close')
    name: EndPilot (${{ matrix.suite }}, ${{ matrix.transport }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        transport: [raknet, nethernet]
        suite: ${{ fromJSON((github.ref_name == 'main' || github.ref_name == 'test/navigation-frontier-20261101') && '["smoke","navigation"]' || '["branch"]') }}
    timeout-minutes: 30
    env:
      ENDPILOT_COMMIT: ${{ inputs.endpilot_commit || '847c0382ed444916172e6643af3795cdfd43a5d8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated Endstone server
        run: |
          python -m venv .venv-server
          .venv-server/bin/python -m pip install 'endstone==0.11.14'
      - name: Get pinned protocol compiler wheel
        uses: actions/download-artifact@v4
        with:
          name: python-pure
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/pure
      - name: Get pinned Linux native protocol wheel
        uses: actions/download-artifact@v4
        with:
          name: python-native-Linux
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/native
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated EndPilot client
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ENDPILOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::endpilot_commit must be a full lowercase 40-character SHA'
            exit 1
          fi
          python -m venv .venv-client
          .venv-client/bin/python -m pip install dependencies/pure/*.whl dependencies/native/*.whl \
            "endpilot[raknet] @ git+https://github.com/ReallocAll/endpilot.git@${ENDPILOT_COMMIT}"
          .venv-client/bin/python -m pip check
          .venv-client/bin/python -m pip show endpilot bedrock-protocol-native
      - name: Exercise public Typed Packet API against fresh real BDS
        shell: bash
        run: |
          if [[ "${{ matrix.suite }}" == "navigation" ]]; then
            .venv-client/bin/python navigation_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ matrix.suite }}" == "smoke" ]]; then
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/world-data-* ]]; then
            .venv-client/bin/python world_probe.py --server-python .venv-server/bin/python --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/navigation-* ]]; then
            .venv-client/bin/python navigation_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/controller-* ]]; then
            .venv-client/bin/python movement_controller_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/motion-* ]]; then
            .venv-client/bin/python motion_probe.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          elif [[ "${{ github.ref_name }}" == test/stability-* ]]; then
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}" --stability
          else
            .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT" --transport "${{ matrix.transport }}"
          fi
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-bds-endpilot-${{ matrix.transport }}${{ matrix.suite == 'navigation' && '-navigation' || '' }}
          path: |
            work/result.json
            work/world_probe.json
            work/motion_trajectory.json
            work/controller_trajectory.json
            work/navigation_trajectory.json
            work/bds.log
            work/server/version.txt
            work/server/server.properties
          if-no-files-found: warn
          retention-days: 14

  network_settings:
    if: github.actor == 'ReallocAll' && (inputs.settings_probe || inputs.join_probe || inputs.position_probe || inputs.walk_probe || (inputs.health_probe == 'mcp-walk' || inputs.health_probe == 'mcp-handoff') || inputs.turn_probe || inputs.follow_probe || inputs.stop_probe || inputs.switch_probe || inputs.obstacle_probe || inputs.identity_probe || inputs.block_probe || inputs.subchunk_probe || inputs.place_probe || inputs.mcp_probe || inputs.kick_probe || inputs.refusal_probe || inputs.timeout_probe || inputs.chat_probe || inputs.command_probe || inputs.entity_probe || (inputs.health_probe == 'true' || inputs.health_probe == 'respawn' || inputs.health_probe == 'hunger') || inputs.hotbar_probe || inputs.mining_probe || inputs.pickup_probe || (inputs.health_probe == 'container' || (inputs.health_probe == 'container-take' || inputs.health_probe == 'container-split') || inputs.health_probe == 'container-put' || inputs.health_probe == 'container-equip' || inputs.health_probe == 'container-server-close' || (inputs.health_probe == 'trade' || inputs.health_probe == 'trade-interrupt' || inputs.health_probe == 'trade-two-input' || inputs.health_probe == 'trade-server-interrupt' || (inputs.health_probe == 'trade-reconnect' || inputs.health_probe == 'trade-original')) || inputs.health_probe == 'form' || (inputs.health_probe == 'craft' || inputs.health_probe == 'craft-store' || inputs.health_probe == 'craft-grid' || (inputs.health_probe == 'craft-workbench' || inputs.health_probe == 'craft-tool') || (inputs.health_probe == 'furnace' || inputs.health_probe == 'furnace-store')) || inputs.health_probe == 'drop'))
    name: EndPilot (settings / ${{ matrix.transport }} / ${{ matrix.entity_scene }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        transport: ${{ fromJSON((inputs.walk_probe || (inputs.health_probe == 'mcp-walk' || inputs.health_probe == 'mcp-handoff') || inputs.turn_probe || inputs.follow_probe || inputs.stop_probe || inputs.switch_probe || inputs.obstacle_probe || inputs.block_probe || inputs.subchunk_probe || inputs.place_probe || inputs.mcp_probe || inputs.kick_probe || inputs.refusal_probe || inputs.timeout_probe || inputs.chat_probe || inputs.command_probe || inputs.entity_probe || (inputs.health_probe == 'true' || inputs.health_probe == 'respawn' || inputs.health_probe == 'hunger') || inputs.hotbar_probe || inputs.mining_probe || inputs.pickup_probe || (inputs.health_probe == 'container' || (inputs.health_probe == 'container-take' || inputs.health_probe == 'container-split') || inputs.health_probe == 'container-put' || inputs.health_probe == 'container-equip' || inputs.health_probe == 'container-server-close' || (inputs.health_probe == 'trade' || inputs.health_probe == 'trade-interrupt' || inputs.health_probe == 'trade-two-input' || inputs.health_probe == 'trade-server-interrupt' || (inputs.health_probe == 'trade-reconnect' || inputs.health_probe == 'trade-original')) || inputs.health_probe == 'form' || (inputs.health_probe == 'craft' || inputs.health_probe == 'craft-store' || inputs.health_probe == 'craft-grid' || (inputs.health_probe == 'craft-workbench' || inputs.health_probe == 'craft-tool') || (inputs.health_probe == 'furnace' || inputs.health_probe == 'furnace-store')) || inputs.health_probe == 'drop')) && '["nethernet","raknet"]' || '["nethernet"]') }}
        entity_scene: ${{ fromJSON(inputs.entity_probe && '["observe","attack","interact"]' || '["observe"]') }}
    timeout-minutes: 30
    env:
      ENDPILOT_COMMIT: ${{ inputs.endpilot_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ReallocAll/endpilot
          ref: ${{ env.ENDPILOT_COMMIT }}
          path: endpilot-src
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated Endstone server
        run: |
          python -m venv .venv-server
          .venv-server/bin/python -m pip install 'endstone==0.11.14'
      - name: Get pinned upstream protocol wheel
        uses: actions/download-artifact@v8
        with:
          name: bedrock_protocol-0.5.0.dev0-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          repository: EndstoneMC/bedrock-protocol
          run-id: 43980162669
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/protocol
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned new EndPilot client
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENDPILOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C endpilot-src rev-parse HEAD)" = "$ENDPILOT_COMMIT"
          python -m venv .venv-client
          extras=nethernet,raknet
          if [[ "${{ inputs.mcp_probe }}" == "true" || "${{ (inputs.health_probe == 'mcp-walk' || inputs.health_probe == 'mcp-handoff') }}" == "true" || "${{ inputs.health_probe }}" == "form" ]]; then extras="$extras,mcp"; fi
          .venv-client/bin/python -m pip install dependencies/protocol/*.whl \
            "endpilot[$extras] @ git+https://github.com/ReallocAll/endpilot.git@${ENDPILOT_COMMIT}"
          if [[ "${{ inputs.health_probe }}" == "form" ]]; then
            .venv-client/bin/python -m pip install --no-deps ./endpilot-src/examples/form_extension
            .venv-client/bin/python -m unittest discover -s endpilot-src/examples/form_extension/tests -v
          fi
          .venv-client/bin/python -m pip check
          .venv-client/bin/python -m pip show endpilot bedrock-protocol
      - name: Verify actual walking against fresh BDS
        if: inputs.walk_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_walk_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/walk.py \
            --transport "${{ matrix.transport }}"
      - name: Verify MCP walk cancellation and continued control on real BDS
        if: (inputs.health_probe == 'mcp-walk' || inputs.health_probe == 'mcp-handoff')
        shell: bash
        run: |
          .venv-client/bin/python nethernet_mcp_walk_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe "${{ inputs.health_probe == 'mcp-handoff' && 'endpilot-src/examples/walk_handoff.py' || 'endpilot-src/examples/walk_mcp.py' }}" \
            --transport "${{ matrix.transport }}" ${{ inputs.health_probe == 'mcp-handoff' && '--handoff' || '' }}
      - name: Verify target-facing walking against fresh real BDS
        if: inputs.turn_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_walk_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/walk.py \
            --transport "${{ matrix.transport }}" --turn
      - name: Verify optional server identity pinning against fresh real BDS
        if: inputs.identity_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_identity_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/join_nethernet.py
      - name: Verify targeted server block update reaches the new player
        if: inputs.block_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_block_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/observe_block.py \
            --transport "${{ matrix.transport }}"
      - name: Verify requested sub-chunk block state against real BDS
        if: inputs.subchunk_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_block_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/observe_sub_chunk.py \
            --transport "${{ matrix.transport }}" --subchunk
      - name: Verify Endstone cancellation and allowed player block placement
        if: inputs.place_probe || inputs.mcp_probe || inputs.kick_probe || inputs.timeout_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_placement_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe ${{ inputs.mcp_probe && 'endpilot-src/examples/place_block_mcp.py' || 'endpilot-src/examples/place_block.py' }} \
            --transport "${{ matrix.transport }}" \
            ${{ inputs.kick_probe && '--kick' || '' }} \
            ${{ inputs.timeout_probe && '--timeout' || '' }}
      - name: Verify player-to-player chat through fresh real BDS
        if: inputs.chat_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_settings_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/chat.py \
            --transport "${{ matrix.transport }}" --chat
      - name: Verify player command and server-side block effect
        if: inputs.command_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_settings_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/command.py \
            --transport "${{ matrix.transport }}" --command
      - name: Verify a target-following turn and BDS player displacement
        if: inputs.follow_probe || inputs.stop_probe || inputs.switch_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_follow_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/follow_entity.py \
            --transport "${{ matrix.transport }}" \
            ${{ inputs.stop_probe && '--stop' || '' }} \
            ${{ inputs.switch_probe && '--switch' || '' }}
      - name: Verify observed-flat-ground route around a real BDS obstacle
        if: inputs.obstacle_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_obstacle_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --transport "${{ matrix.transport }}"
      - name: Verify actor spawn, movement and removal on the live client
        if: inputs.entity_probe && matrix.entity_scene == 'observe'
        shell: bash
        run: |
          .venv-client/bin/python nethernet_entity_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/observe_entity.py \
            --transport "${{ matrix.transport }}"
      - name: Verify player attack against live BDS actor
        if: inputs.entity_probe && matrix.entity_scene == 'attack'
        shell: bash
        run: |
          .venv-client/bin/python nethernet_entity_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/attack_entity.py \
            --transport "${{ matrix.transport }}" --attack
      - name: Verify right-click actor triggers a real Endstone event
        if: inputs.entity_probe && matrix.entity_scene == 'interact'
        shell: bash
        run: |
          .venv-client/bin/python nethernet_entity_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/interact_entity.py \
            --transport "${{ matrix.transport }}" --interact
      - name: Verify player health, hunger or respawn against real BDS
        if: (inputs.health_probe == 'true' || inputs.health_probe == 'respawn' || inputs.health_probe == 'hunger')
        shell: bash
        run: |
          .venv-client/bin/python nethernet_health_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe "${{ inputs.health_probe == 'respawn' && 'endpilot-src/examples/respawn.py' || inputs.health_probe == 'hunger' && 'endpilot-src/examples/observe_hunger.py' || 'endpilot-src/examples/observe_health.py' }}" \
            --transport "${{ matrix.transport }}" \
            ${{ inputs.health_probe == 'respawn' && '--respawn' || inputs.health_probe == 'hunger' && '--hunger' || '' }}
      - name: Verify public chest opening and server container window
        if: (inputs.health_probe == 'container' || (inputs.health_probe == 'container-take' || inputs.health_probe == 'container-split') || inputs.health_probe == 'container-put' || inputs.health_probe == 'container-equip' || inputs.health_probe == 'container-server-close')
        shell: bash
        run: |
          .venv-client/bin/python nethernet_container_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/open_container.py \
            --transport "${{ matrix.transport }}" ${{ inputs.health_probe == 'container-split' && '--take --split' || inputs.health_probe == 'container-take' && '--take --chat-during-take --server-grant-during-take' || inputs.health_probe == 'container-put' && '--put' || inputs.health_probe == 'container-equip' && '--equip' || inputs.health_probe == 'container-server-close' && '--server-close' || '' }}
      - name: Verify a player inventory drop and actual BDS world item
        if: inputs.health_probe == 'drop'
        shell: bash
        run: |
          .venv-client/bin/python nethernet_container_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/open_container.py \
            --transport "${{ matrix.transport }}" --drop
      - name: Verify one server-accepted inventory auto-craft and BDS output
        if: (inputs.health_probe == 'craft' || inputs.health_probe == 'craft-store' || inputs.health_probe == 'craft-grid')
        shell: bash
        run: |
          .venv-client/bin/python nethernet_craft_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe ${{ inputs.health_probe == 'craft-grid' && 'endpilot-src/examples/craft_grid.py' || 'endpilot-src/examples/craft_recipe.py' }} \
            --transport "${{ matrix.transport }}" ${{ inputs.health_probe == 'craft-store' && '--store' || inputs.health_probe == 'craft-grid' && '--grid' || '' }}
      - name: Verify nine-ingot 3x3 crafting through the public SDK and real BDS
        if: inputs.health_probe == 'craft-workbench'
        shell: bash
        run: |
          .venv-client/bin/python nethernet_craft_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/craft_workbench.py \
            --transport "${{ matrix.transport }}" --workbench
      - name: Verify workbench wooden pickaxe crafting and chest storage
        if: inputs.health_probe == 'craft-tool'
        shell: bash
        run: |
          .venv-client/bin/python nethernet_craft_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/craft_pickaxe.py \
            --transport "${{ matrix.transport }}" --tool --store --equip
      - name: Verify real BDS furnace smelting, output and optional chest storage
        if: (inputs.health_probe == 'furnace' || inputs.health_probe == 'furnace-store')
        shell: bash
        run: |
          .venv-client/bin/python nethernet_furnace_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/smelt_furnace.py \
            --transport "${{ matrix.transport }}" ${{ inputs.health_probe == 'furnace-store' && '--store' || '' }}
      - name: Verify a server-issued villager trade window and item quotes
        if: (inputs.health_probe == 'trade' || inputs.health_probe == 'trade-interrupt' || inputs.health_probe == 'trade-two-input' || inputs.health_probe == 'trade-server-interrupt' || (inputs.health_probe == 'trade-reconnect' || inputs.health_probe == 'trade-original'))
        shell: bash
        run: |
          .venv-client/bin/python nethernet_trade_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/observe_trades.py \
            --transport "${{ matrix.transport }}" \
            ${{ inputs.health_probe == 'trade-interrupt' && '--interrupt' || '' }} \
            ${{ inputs.health_probe == 'trade-two-input' && '--two-input' || '' }} \
            ${{ (inputs.health_probe == 'trade-server-interrupt' || (inputs.health_probe == 'trade-reconnect' || inputs.health_probe == 'trade-original')) && '--server-interrupt' || '' }} \
            ${{ (inputs.health_probe == 'trade-reconnect' || inputs.health_probe == 'trade-original') && '--reconnect' || '' }} \
            ${{ inputs.health_probe == 'trade-original' && '--original-trader' || '' }}
      - name: Verify installable MCP action-form extension with server callback
        if: inputs.health_probe == 'form'
        shell: bash
        run: |
          .venv-client/bin/python nethernet_form_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/respond_form_mcp.py \
            --transport "${{ matrix.transport }}"
      - name: Verify hotbar selection and held-item air-use on real BDS
        if: inputs.hotbar_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_hotbar_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/use_item.py \
            --transport "${{ matrix.transport }}" --use-item
      - name: Verify survival mining from public SDK on real BDS
        if: inputs.mining_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_mining_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/mine_block.py \
            --transport "${{ matrix.transport }}"
      - name: Verify mined-item pickup and inventory placement on BDS
        if: inputs.pickup_probe
        shell: bash
        run: |
          .venv-client/bin/python nethernet_mining_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe endpilot-src/examples/collect_drop.py \
            --transport "${{ matrix.transport }}" --pickup --place-collected
      - name: Verify settings or player join against fresh real BDS
        if: "!inputs.walk_probe && (inputs.health_probe != 'mcp-walk' && inputs.health_probe != 'mcp-handoff') && !inputs.turn_probe && !inputs.follow_probe && !inputs.stop_probe && !inputs.switch_probe && !inputs.obstacle_probe && !inputs.identity_probe && !inputs.block_probe && !inputs.subchunk_probe && !inputs.place_probe && !inputs.mcp_probe && !inputs.kick_probe && !inputs.timeout_probe && !inputs.chat_probe && !inputs.command_probe && !inputs.entity_probe && inputs.health_probe != 'true' && inputs.health_probe != 'respawn' && inputs.health_probe != 'hunger' && !inputs.hotbar_probe && !inputs.mining_probe && !inputs.pickup_probe && (inputs.health_probe != 'container' && inputs.health_probe != 'container-take' && inputs.health_probe != 'container-split' && inputs.health_probe != 'container-put' && inputs.health_probe != 'container-equip' && (inputs.health_probe != 'trade' && inputs.health_probe != 'trade-interrupt' && inputs.health_probe != 'trade-two-input' && (inputs.health_probe != 'trade-server-interrupt' && (inputs.health_probe != 'trade-reconnect' && inputs.health_probe != 'trade-original'))) && inputs.health_probe != 'form' && inputs.health_probe != 'craft' && inputs.health_probe != 'craft-store' && inputs.health_probe != 'craft-grid' && (inputs.health_probe != 'craft-workbench' && inputs.health_probe != 'craft-tool') && (inputs.health_probe != 'furnace' && inputs.health_probe != 'furnace-store') && inputs.health_probe != 'drop' && inputs.health_probe != 'container-server-close')"
        shell: bash
        run: |
          .venv-client/bin/python nethernet_settings_probe.py \
            --server-python .venv-server/bin/python \
            --endpilot-commit "$ENDPILOT_COMMIT" \
            --probe "${{ inputs.refusal_probe && 'endpilot-src/examples/refused_login.py' || inputs.position_probe && 'endpilot-src/examples/observe_position_nethernet.py' || inputs.join_probe && 'endpilot-src/examples/join_nethernet.py' || 'endpilot-src/examples/probe_nethernet.py' }}" \
            --transport "${{ matrix.transport }}" \
            ${{ inputs.refusal_probe && '--refused' || inputs.position_probe && '--position' || inputs.join_probe && '--join' || '' }}
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-bds-endpilot-network-settings-${{ matrix.transport }}-${{ matrix.entity_scene }}
          path: |
            work/result.json
            work/villager_trade_result.json
            work/bds.log
            work/server/version.txt
            work/server/server.properties
          if-no-files-found: warn
          retention-days: 14
