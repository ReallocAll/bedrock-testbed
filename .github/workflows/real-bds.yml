name: Real BDS EndPilot Smoke

on:
  push:
    branches: [feat/endpilot-real-bds, 'test/**', 'fix/**', main]
  workflow_dispatch:
    inputs:
      endpilot_commit:
        description: 'Exact EndPilot commit SHA (40 lowercase hex characters)'
        required: false
        type: string
        default: 'f0f9e9a57d1cca142ad5779fa9a3fbccbfbe7ae1'

permissions:
  contents: read

concurrency:
  group: real-bds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpilot:
    if: github.actor == 'ReallocAll'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENDPILOT_COMMIT: ${{ inputs.endpilot_commit || 'f0f9e9a57d1cca142ad5779fa9a3fbccbfbe7ae1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated Endstone server
        run: |
          python -m venv .venv-server
          .venv-server/bin/python -m pip install 'endstone==0.11.14'
          .venv-server/bin/python -m pip install --no-deps ./diagnostics/input_probe
      - name: Get pinned protocol compiler wheel
        uses: actions/download-artifact@v4
        with:
          name: python-pure
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/pure
      - name: Get pinned Linux native protocol wheel
        uses: actions/download-artifact@v4
        with:
          name: python-native-Linux
          repository: ReallocAll/bedrock-protocol
          run-id: 41009758882
          github-token: ${{ secrets.REPO_DEVELOP }}
          path: dependencies/native
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated EndPilot client
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ENDPILOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::endpilot_commit must be a full lowercase 40-character SHA'
            exit 1
          fi
          python -m venv .venv-client
          .venv-client/bin/python -m pip install dependencies/pure/*.whl dependencies/native/*.whl \
            "endpilot[raknet] @ git+https://github.com/ReallocAll/endpilot.git@${ENDPILOT_COMMIT}"
          .venv-client/bin/python -m pip check
          .venv-client/bin/python -m pip show endpilot bedrock-protocol-native
      - name: Exercise public Typed Packet API against fresh real BDS
        run: .venv-client/bin/python testbed.py --server-python .venv-server/bin/python --endpilot-commit "$ENDPILOT_COMMIT"
      - name: Save evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-bds-endpilot
          path: |
            work/result.json
            work/bds.log
            work/server/version.txt
            work/server/server.properties
          if-no-files-found: warn
          retention-days: 14
